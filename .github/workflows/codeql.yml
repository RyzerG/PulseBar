name: Validate Xcode project

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  validate:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List Xcode schemes
        run: |
          xcodebuild -list -project PulseBar.xcodeproj

      - name: Build project without signing
        run: |
          xcodebuild \
            -project PulseBar.xcodeproj \
            -scheme PulseBar \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath .build/derivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build
