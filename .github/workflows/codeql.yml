name: Build Validation

permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  validate:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest installed Xcode
        run: |
          LATEST_XCODE="$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' | sort -V | tail -n 1)"
          if [ -z "$LATEST_XCODE" ]; then
            echo "No Xcode installation found in /Applications" >&2
            exit 1
          fi
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version

      - name: List Xcode schemes
        run: |
          xcodebuild -list -project PulseBar.xcodeproj

      - name: Build project without signing
        run: |
          xcodebuild \
            -project PulseBar.xcodeproj \
            -scheme PulseBar \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath .build/derivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build
